<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARVEL RIVALS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <h1>RIVALS</h1>
        </div>
        
        <div class="cards-container">
            <img src="../BLOG/images/componentes png.png" alt="Componentes" class="logo">
            <!-- Cards serão preenchidos pelo JavaScript -->
            <div class="card" data-hero="Mister Fantastic">
                <img src="https://via.placeholder.com/300x200" alt="Carregando..." loading="lazy">
                <h3>SENHOR FANTÁSTICO</h3>
                <p>.Reed Richards.</p>
            </div>
            <div class="card" data-hero="Invisible Woman">
                <img src="https://via.placeholder.com/300x200" alt="Carregando..." loading="lazy">
                <h3>MULHER INVISIVEL</h3>
                <p>.Sue Storm.</p>
            </div>
            <div class="card" data-hero="Human Torch">
                <img src="https://via.placeholder.com/300x200" alt="Carregando..." loading="lazy">
                <h3>TOCHA HUMANA</h3>
                <p>.Johnny Storm.</p>
            </div>
            <div class="card" data-hero="Thing">
                <img src="https://via.placeholder.com/300x200" alt="Carregando..." loading="lazy">
                <h3>O COISA</h3>
                <p>.Ben Grimm.</p>
            </div>
            <div class="card" data-hero="Silver Surfer">
                <img src="https://via.placeholder.com/300x200" alt="Carregando..." loading="lazy">
                <h3>SURFISTA PRATEADO</h3>
                <p>.Norrin Radd.</p>
            </div>
            <div class="card" data-hero="Namor">
                <img src="https://via.placeholder.com/300x200" alt="Carregando..." loading="lazy">
                <h3>NAMOR</h3>
                <p>.Namor McKenzie.</p>
            </div>
            <div class="card" data-hero="Doctor Doom">
                <img src="https://via.placeholder.com/300x200" alt="Carregando..." loading="lazy">
                <h3>DOUTOR DESTINO</h3>
                <p>.Victor von Doom.</p>
            </div>
            <img src="../BLOG/images/quarteto fantastico logo png.png" alt="Quarteto Fantástico" class="components">
        </div>
    </div>

    <footer>
        <p class="copyright">&copy; <span id="year"></span> Marvel Rivals. Todos os direitos reservados.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
